version: "3.8"

services:
  # PostgreSQL with TimescaleDB
  database:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=state_fiscal_feed
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Service
    api-service:
      build:
        context: .
        dockerfile: Dockerfile.api
      environment:
        - DATABASE_URL=postgresql://postgres:postgres@database:5432/state_fiscal_feed
        - FRED_API_KEY=fcfcadc5d10e4886f2113d0b729193a4
      ports:
        - "8000:8000"
      depends_on:
        database:
          condition: service_healthy
      volumes:
        - ./src:/app/src
        - ./config:/app/config
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
        interval: 30s
        timeout: 10s
        retries: 5

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
